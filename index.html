<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline Maker</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="workspace-shell" id="workspaceShell">
      <aside class="timeline-sidebar" id="timelineSidebar" aria-label="Timelines">
        <div class="sidebar-header">
          <div class="sidebar-title">
            <span>Timelines</span>
            <strong id="timelineCountLabel">0</strong>
          </div>
          <button
            id="toggleSidebarButton"
            class="icon-button"
            type="button"
            aria-label="Collapse timeline list"
          >
            &lt;
          </button>
        </div>
        <div class="sidebar-body">
          <div id="timelineList" class="timeline-list"></div>
          <div class="timeline-actions">
            <button id="newTimelineButton" type="button">+ New</button>
            <button id="duplicateTimelineButton" type="button">Duplicate</button>
            <button id="deleteTimelineButton" type="button">Delete</button>
          </div>
        </div>
      </aside>

    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Milestone planner</p>
          <h1>Timeline Maker</h1>
          <input
            id="timelineNameInput"
            class="timeline-name-input"
            aria-label="Timeline name"
          />
        </div>

        <dl class="metrics" aria-label="Timeline status summary">
          <div class="metric-box">
            <dt>Total</dt>
            <dd id="totalCount">0</dd>
          </div>
          <div class="metric-box metric-completed">
            <dt>Complete</dt>
            <dd id="completedCount">0</dd>
          </div>
          <div class="metric-box metric-overdue">
            <dt>Overdue</dt>
            <dd id="overdueCount">0</dd>
          </div>
          <div class="metric-box metric-upcoming">
            <dt>Upcoming</dt>
            <dd id="upcomingCount">0</dd>
          </div>
        </dl>
      </header>

      <section class="control-panel" aria-label="Timeline controls">
        <div class="control-field">
          <label for="asOfInput">Current date</label>
          <div class="control-row">
            <input id="asOfInput" type="date" />
            <button id="nowButton" type="button">Now</button>
          </div>
        </div>

        <div class="toggle-stack">
          <label class="toggle-row">
            <input id="showTodayInput" type="checkbox" checked />
            <span>Show current-date line</span>
          </label>
          <label class="toggle-row">
            <input id="includeTimesInput" type="checkbox" />
            <span>Specify times</span>
          </label>
        </div>

        <div class="control-actions">
          <button id="addButton" type="button">+ Add milestone</button>
          <button id="sortButton" type="button">Sort by date</button>
          <button id="resetButton" type="button">Reset sample</button>
          <button id="downloadButton" type="button">Download SVG</button>
          <button id="downloadPngButton" type="button">Download PNG</button>
        </div>
      </section>

      <section class="timeline-panel" aria-label="Timeline visual">
        <div id="timelineMount"></div>
      </section>

      <section class="editor-panel" aria-label="Milestones">
        <div class="editor-grid editor-head">
          <span>Milestone</span>
          <span id="dateColumnLabel">Date</span>
          <span>Owner</span>
          <span>Status</span>
          <span>Signal</span>
          <span aria-hidden="true"></span>
        </div>
        <div id="milestoneRows" class="editor-body"></div>
        <div class="editor-footer">
          <button id="addListButton" class="add-list-button" type="button">
            + Add milestone
          </button>
        </div>
      </section>
    </main>
    </div>

    <div id="titleEditLayer" class="title-edit-layer"></div>
    <div id="ownerMenuLayer" class="owner-menu-layer"></div>
    <div id="statusMenuLayer" class="status-menu-layer"></div>
    <div id="detailsPopoverLayer" class="details-popover-layer"></div>
    <div id="riskPopoverLayer" class="risk-popover-layer"></div>

    <dialog id="personDialog" class="person-dialog">
      <form id="personForm" class="person-form" method="dialog">
        <div class="person-dialog-header">
          <h2 id="personDialogTitle">Add person</h2>
          <button
            id="cancelPersonButton"
            class="icon-button"
            type="button"
            aria-label="Close"
          >
            &times;
          </button>
        </div>

        <label class="person-field">
          <span>Name</span>
          <input id="personNameInput" autocomplete="name" required />
        </label>

        <label class="person-field">
          <span>Email</span>
          <input id="personEmailInput" autocomplete="email" type="email" />
        </label>

        <div class="person-avatar-field">
          <div id="personPhotoPreview" class="person-photo-preview"></div>
          <div class="person-avatar-actions">
            <label class="upload-button">
              Upload avatar
              <input
                id="personPhotoInput"
                class="file-input"
                type="file"
                accept="image/*"
              />
            </label>
            <button id="clearPersonPhotoButton" type="button">Clear avatar</button>
          </div>
        </div>

        <div class="person-dialog-actions">
          <button id="savePersonButton" type="submit">Save person</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
